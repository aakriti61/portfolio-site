{% extends 'base.html' %}

{% block title %}Projects{% endblock %}

{% block content %}
<h1>My Projects</h1>
{% for project in projects %}
    <div>
        <h3><a href="{% url 'project_detail' project.slug %}">{{ project.title }}</a></h3>
        <p>{{ project.description|truncatewords:20 }}</p>
        <p><em>{{ project.tech_stack }}</em></p>
    </div>
{% empty %}
    <p>No projects yet.</p>
{% endfor %}
{% endblock %}
